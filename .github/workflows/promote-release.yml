name: Promote MacTree release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/promote-release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Mark existing release as latest full release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit v1.0.0-beta.1 --prerelease=false --latest
